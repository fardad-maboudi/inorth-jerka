<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آفلاین</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf7f8;
        color: #1a0a0f;
      }
      main { text-align: center; padding: 2rem; }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #99002e;
        color: #fff;
        padding: 0.75rem 1.25rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>وقتی آنلاین شدید دوباره تلاش کنید. سبد خرید و پرداخت آفلاین در دسترس نیست.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
